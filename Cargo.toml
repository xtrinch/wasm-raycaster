[workspace]
members = ["crates/raycast-engine"]
# Plain cargo test and cargo check cover the engine as well as the game bindings.
default-members = [".", "crates/raycast-engine"]

# The game: the wasm-bindgen API that the TypeScript app calls, built by wasm-pack.
[package]
name = "raycaster"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
raycast-engine = { path = "crates/raycast-engine" }
js-sys = "0.3.77"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
web-sys = { version= "0.3.77", features= ["Performance", "Window"]}
wasm-bindgen-rayon = { version = "1.3.0", optional = true }


[features]
parallel = ["wasm-bindgen-rayon"]

[profile.release]
#opt-level = 3
#debug = true

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O4', '-g', '--enable-simd']
debug = true
