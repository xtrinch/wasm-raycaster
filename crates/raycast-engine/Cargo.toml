[package]
name = "raycast-engine"
version = "0.1.0"
edition = "2021"
description = "A CPU grid raycaster with thin walls, doors, windows, roofs, flight and mesh compositing"
license = "MIT OR Apache-2.0"
publish = false # until the API settles; see docs/optimization-roadmap.md

[dependencies]
geo = "0.30.0"
num-traits = "0.2.19"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
smallvec = "1.15.0"

[dev-dependencies]
png = "0.17"
serde_json = "1"
