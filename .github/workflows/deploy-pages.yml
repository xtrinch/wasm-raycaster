# Builds the site on pull requests and deploys it to GitHub Pages from main.
name: Deploy static content to Pages

on:
  # Deploys pushes to the default branch
  push:
    branches: ['main']

  # Builds pull requests without deploying
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push to the same branch or pull request replaces an unfinished build.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # pnpm must read lockfile v9; older versions ignore it and resolve newer deps.
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build-gh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: './packages/app/dist'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Allow one concurrent deployment
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
